name: Quest 3 OpenXR Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - quest3-vr-dev
    paths:
      - .github/workflows/quest-openxr.yml

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout BLACK VR modifications
        uses: actions/checkout@v4
        with:
          path: black-vr

      - name: Download Meta OpenXR SDK
        uses: actions/checkout@v4
        with:
          repository: meta-quest/Meta-OpenXR-SDK
          path: meta-sdk

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install "platforms;android-32" "build-tools;32.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Apply BLACK VR aiming prototype
        run: python3 black-vr/vr-prototype/patch_xrinput.py meta-sdk

      - name: Add weapon calibration
        run: python3 black-vr/vr-prototype/patch_calibration.py meta-sdk

      - name: Fix cube calibration input conflict
        run: python3 black-vr/vr-prototype/patch_input_conflict.py meta-sdk

      - name: Fix calibration A button
        run: python3 black-vr/vr-prototype/patch_mode_button.py meta-sdk

      - name: Fix calibration display position
        run: python3 black-vr/vr-prototype/patch_display.py meta-sdk

      - name: Add headset following calibration display
        run: python3 black-vr/vr-prototype/patch_hud.py meta-sdk

      - name: Fix HUD alignment and live values
        run: python3 black-vr/vr-prototype/patch_hud_v9.py meta-sdk

      - name: Build OpenXR test APK
        working-directory: meta-sdk/Samples/XrSamples/XrInput/Projects/Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-OpenXR-Test
          path: meta-sdk/Samples/XrSamples/XrInput/Projects/Android/build/outputs/apk/debug/*.apk
